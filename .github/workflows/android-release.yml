name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Rename APK for release
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          cp build/app/outputs/flutter-apk/app-release.apk "melow-tic-tac-toe-${TAG}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: melow-tic-tac-toe-apk
          path: melow-tic-tac-toe-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Melow Tic Tac Toe ${{ github.ref_name }}
          generate_release_notes: true
          files: melow-tic-tac-toe-*.apk
