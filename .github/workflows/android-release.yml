name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Configure release signing (when GitHub Secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Upload keystore and key.properties created."
          else
            echo "KEYSTORE_BASE64 secret not set; generating CI fallback key.properties."
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            cat <<EOF > android/key.properties
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$HOME/.android/debug.keystore
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Build Play Store App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Rename release binaries
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          cp build/app/outputs/flutter-apk/app-release.apk "melow-tic-tac-toe-${TAG}.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "melow-tic-tac-toe-${TAG}.aab"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melow-tic-tac-toe-android
          path: |
            melow-tic-tac-toe-*.apk
            melow-tic-tac-toe-*.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Melow Tic Tac Toe ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            melow-tic-tac-toe-*.apk
            melow-tic-tac-toe-*.aab
