name: melow_tic_tac_toe
description: Multiplayer emoji tic tac toe by Melow Labs
publish_to: none
version: 3.0.2+5

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  shared_preferences: ^2.5.6
  audioplayers: ^6.7.1
  confetti: ^0.8.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  flutter_webrtc: ^1.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/melow_logo.png
  adaptive_icon_background: '#101125'
  adaptive_icon_foreground: assets/images/melow_logo.png
  min_sdk_android: 21

flutter_native_splash:
  color: '#101125'
  image: assets/images/melow_logo.png
  color_dark: '#101125'
  image_dark: assets/images/melow_logo.png
  android_12:
    color: '#101125'
    image: assets/images/melow_logo.png
    icon_background_color: '#101125'
  web: false
  ios: false
